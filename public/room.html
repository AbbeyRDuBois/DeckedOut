<!-- Contains common UI elements in rooms -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Layout</title>
  </head>

                ></path>
              </g>
            </svg>
          </span>
        </div>
        <div class="options">
          <div id="spotify">
            <a
              id="spotify-id"
              class="spotify-icon spotify-link"
              href="https://open.spotify.com/playlist/62dcOrotfvGu6k6UzyuDIg?si=7acab1a28f5f44f5"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open Spotify playlist"
              title="Spotify"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="800px"
                height="800px"
                viewBox="0 0 20 20"
              >
                <rect x="0" fill="none" width="20" height="20" />
                <g>
                  <path
                    d="M10 2c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm3.7 11.5c-.1.2-.5.3-.7.2-2.1-1.2-4.7-1.5-7-.8-.3 0-.5-.1-.6-.4 0-.2.1-.5.4-.6 2.6-.8 5.4-.4 7.8.9.1.2.2.5.1.7zm1-2.1c-.1 0-.1 0 0 0-.2.3-.6.4-.9.2-2.4-1.4-5.3-1.7-8-.9-.3.1-.7-.1-.8-.4-.1-.4.1-.7.4-.9 3-.9 6.3-.5 9 1.1.3.2.4.6.3.9zm0-2.3c-2.6-1.5-6.8-1.7-9.3-.9-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-1 2.8-.8 7.5-.7 10.5 1.1.4.2.5.7.3 1-.3.4-.7.5-1.1.3z"
                  />
                </g>
              </svg>
            </a>
          </div>
          <div id="settings">
            <span id="settings-id" class="settings-icon" title="Settings">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="800px"
                height="800px"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"

                  fill="#1C274C"
                />
              </svg>
            </span>
            <div id="settings-panel" class="settings-panel closed">
              <h2>Settings</h2>
              <label for="theme-selector">Select Theme:</label>
              <select id="theme-selector" class="theme-selector">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="navy">Navy</option>
                <option value="pink_rose">Pink Rose</option>
                <option value="ocean">Ocean</option>
                <option value="cursed">Cursed</option>
                <option value="blessed">Blessed</option>
                <option value="fancy">Fancy</option>
              </select>
              <label for="card-theme-selector">Select Card Theme:</label>
              <select class="theme-selector" id="card-theme-selector">
                <option value="Classic">Classic</option>
                <option value="Cats">Cats</option>
                <option value="Pokemon">Pokemon</option>
                <option value="StarWars">StarWars</option>
                <option value="Genshin">Genshin</option>
                <option value="Hollow">Hollow Knight</option>
              </select>
            </div>
          </div>
          <button class="leave-room" id="top-bar">Leave</button>
        </div>
      </header>
      <footer id="hand"></footer>
      <aside id="scoreboard"></aside>
      <aside id="logs" class="logs"></aside>
      <main class="center">
        <div class="opponents-container" id="opponents"></div>
        <div
          class="center-main"
          id="center-content"
          style="display: none"
        ></div>
        <!--This is where the room specific inner content will go (like flipped for cribbage)-->
        <div id="played-container" class="played-container"></div>
        <div class="local-indicator" data-type="turn" id="local-turn-indicator">
          T
        </div>
        <div class="roles">
          <button id="garbage" class="role-btn" data-color="teal">GM</button>
          <button id="dumpster" class="role-btn" data-color="lightgreen">
            DB
          </button>
          <button id="glamour" class="role-btn" data-color="orange">GG</button>
          <button id="treasure" class="role-btn" data-color="tomato">TL</button>
        </div>
      </main>
    </div>
    <div id="loading-overlay" class="popup-overlay loading-overlay">
      <div class="loading-screen">
        <div class="loading-text">Loading</div>
        <div class="loading-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div id="waiting-overlay" class="popup-overlay">
      <div id="waiting-popup" class="popup">
        <div id="waiting-container">
          <div class="room-info">
            <div class="room-id" id="waiting-id"></div>
            <span id="copy-room-id" class="copy-icon" title="Copy to clipboard">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M15.24 2H11.3458C9.58159 1.99999 8.18418 1.99997 7.09054 2.1476C5.96501 2.29953 5.05402 2.61964 4.33559 3.34096C3.61717 4.06227 3.29833 4.97692 3.14701 6.10697C2.99997 7.205 2.99999 8.60802 3 10.3793V16.2169C3 17.725 3.91995 19.0174 5.22717 19.5592C5.15989 18.6498 5.15994 17.3737 5.16 16.312L5.16 11.3976L5.16 11.3024C5.15993 10.0207 5.15986 8.91644 5.27828 8.03211C5.40519 7.08438 5.69139 6.17592 6.4253 5.43906C7.15921 4.70219 8.06404 4.41485 9.00798 4.28743C9.88877 4.16854 10.9887 4.1686 12.2652 4.16867L12.36 4.16868H15.24L15.3348 4.16867C16.6113 4.1686 17.7088 4.16854 18.5896 4.28743C18.0627 2.94779 16.7616 2 15.24 2Z"
                    fill="#597B91"
                  ></path>
                  <path
                    d="M6.6001 11.3974C6.6001 8.67119 6.6001 7.3081 7.44363 6.46118C8.28716 5.61426 9.64481 5.61426 12.3601 5.61426H15.2401C17.9554 5.61426 19.313 5.61426 20.1566 6.46118C21.0001 7.3081 21.0001 8.6712 21.0001 11.3974V16.2167C21.0001 18.9429 21.0001 20.306 20.1566 21.1529C19.313 21.9998 17.9554 21.9998 15.2401 21.9998H12.3601C9.64481 21.9998 8.28716 21.9998 7.44363 21.1529C6.6001 20.306 6.6001 18.9429 6.6001 16.2167V11.3974Z"
                    fill="#597B91"
                  ></path>
                </g>
              </svg>
            </span>
          </div>
          <div id="waiting-list"></div>
          <div id="teams-container"></div>
          <div id="popup-btns">
            <button id="start-game">Start</button>
            <button class="leave-room">Leave</button>
          </div>
        </div>
        <div class="divide-line" id="divide" style="display: none"></div>
        <div id="options-container">
          <div class="options-title">Game Options</div>
          <div class="options-content" id="options-content"></div>
        </div>
      </div>
    </div>
    <div id="winner-overlay" class="popup-overlay" style="display: none">
      <div id="winner-popup" class="popup">
        <div id="winners"></div>
        <div id="popup-btns">
          <button class="leave-room">Leave</button>
        </div>
      </div>
    </div>
  </body>
</html>
